<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bolão SIC 2026</title>
  <style>
    :root {
      --bg1:#f8fafc; --bg2:#ecfdf5; --card:#ffffffdd; --text:#0f172a; --muted:#64748b;
      --line:#cbd5e1; --green:#047857; --blue:#1d4ed8; --red:#be123c;
      --gold:rgba(250,204,21,.38); --silver:rgba(148,163,184,.35); --bronze:rgba(180,83,9,.22);
    }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial, Helvetica, sans-serif; color:var(--text); background:repeating-linear-gradient(90deg,#14532d 0px,#14532d 40px,#166534 40px,#166534 80px); }
    .wrap { max-width:1280px; margin:0 auto; padding:24px; }
    header { background:rgba(255,255,255,.85); border:1px solid rgba(255,255,255,.9); border-radius:26px; padding:22px; box-shadow:0 8px 24px rgba(15,23,42,.06); margin-bottom:18px; }
    .top { display:flex; gap:18px; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; }
    h1 { margin:4px 0 8px; font-size:32px; letter-spacing:-.03em; }
    .eyebrow { color:var(--green); font-weight:700; font-size:14px; }
    .subtitle { color:var(--muted); max-width:820px; line-height:1.45; margin:0; font-size:14px; }
    .tabs { display:flex; gap:8px; background:#f1f5f9; padding:6px; border-radius:18px; flex-wrap:wrap; }
    .tab { border:0; background:transparent; padding:11px 15px; border-radius:14px; cursor:pointer; font-weight:700; color:#334155; }
    .tab:hover { background:#15803d; color:white; transition:.2s; }
    .tab.active { background:#16a34a; box-shadow:0 4px 14px rgba(22,163,74,.35); color:white; }
    .toolbar { display:grid; grid-template-columns:1fr minmax(280px,430px); gap:14px; margin:24px 0; }
    .search { width:100%; border:2px solid #10b981; border-radius:18px; padding:14px 16px; font-size:14px; outline:none; background:#ffffffe6; box-shadow:0 4px 14px rgba(15,23,42,.04); }
    .note { background:rgba(219,234,254,.72); border:1px solid #bfdbfe; border-radius:18px; padding:14px; color:#1e3a8a; font-size:13px; line-height:1.38; }
    .sections { display:grid; gap:16px; }
    .card { background:var(--card); border:2px solid var(--line); border-radius:22px; box-shadow:0 6px 18px rgba(15,23,42,.05); overflow:hidden; }
    .card-head { display:flex; justify-content:space-between; gap:10px; align-items:center; padding:14px 16px; border-bottom:1px solid #eef2f7; }
    .card-title { margin:0; font-size:16px; }
    .card-sub { margin:4px 0 0; color:var(--muted); font-size:12px; }
    .badge { display:inline-flex; align-items:center; white-space:nowrap; background:#f1f5f9; border-radius:999px; padding:6px 10px; color:#475569; font-size:12px; font-weight:700; }
    .table-scroll { max-height:330px; overflow:auto; padding:6px; }
    table { width:100%; border-collapse:separate; border-spacing:0; font-size:13px; min-width:760px; }
    th { text-align:left; color:#64748b; text-transform:uppercase; font-size:11px; letter-spacing:.05em; background:#fff; position:sticky; top:0; z-index:3; padding:10px; border-bottom:1px solid var(--line); }
    td { padding:10px; border-bottom:1px solid #eef2f7; vertical-align:middle; }
    tbody tr:nth-child(odd) { background:rgba(248,250,252,.72); }
    .right { text-align:right; } .center { text-align:center; }
    .score { display:inline-flex; min-width:58px; justify-content:center; padding:5px 9px; border-radius:12px; font-weight:800; background:#0f172a; color:#fff; }
    .score.empty { background:#f1f5f9; color:#64748b; }
    .pred.exact { background:#dcfce7; color:#166534; }
    .pred.result { background:#dbeafe; color:#1d4ed8; }
    .pred.none { background:#ffe4e6; color:#be123c; }
    .pred.wait { background:#f1f5f9; color:#64748b; }
    .sticky-left { position:sticky; left:0; z-index:4; background:#fff; box-shadow:1px 0 0 #e2e8f0; }
    .rank-table { border-spacing:0 8px; min-width:780px; }
    .rank-table td { border:0; background:#fff; }
    .rank-table tr.top1 td { background:var(--gold); }
    .rank-table tr.top2 td { background:var(--silver); }
    .rank-table tr.top3 td { background:var(--bronze); }
    .rank-table td:first-child { border-radius:16px 0 0 16px; font-weight:900; }
    .rank-table td:last-child { border-radius:0 16px 16px 0; }
    .points { font-weight:900; font-size:18px; }
    .legend { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; color:#475569; font-size:12px; }
    .legend span { border-radius:999px; padding:5px 8px; background:#f8fafc; border:1px solid #e2e8f0; }
    .hidden { display:none; }
    footer { color:#64748b; font-size:12px; text-align:center; padding:24px 0 6px; }
    @media (max-width:820px) { .toolbar { grid-template-columns:1fr; } .wrap { padding:14px; } h1 { font-size:26px; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="top">
        <div>
          <div class="eyebrow" id="last-update">Última atualização: carregando...</div>
          <h1>Bolão Copa 2026</h1>
          <p class="subtitle">Pontuação: 9 pontos por placar exato, 3 pontos por resultado correto e 0 ponto quando não houver acerto.</p>
        </div>
        <nav class="tabs" aria-label="Abas">
          <button class="tab active" data-tab="predictions">Palpites</button>
          <button class="tab" data-tab="ranking">Ranking</button>
          <button class="tab" data-tab="results">Resultados</button>
        </nav>
      </div>
    </header>

    <div class="toolbar">
      <input id="search" class="search" placeholder="Filtrar por participante, seleção, jogo ou fase...">
    </div>
    
    <main>
      <section id="loading" class="card" style="padding:18px;">Carregando dados...</section>
      <section id="predictions" class="tab-panel hidden"></section>
      <section id="ranking" class="tab-panel hidden"></section>
      <section id="results" class="tab-panel hidden"></section>
    </main>
  </div>

<script>
let DATA = null;
let predMap = new Map();

const byId = (id) => document.getElementById(id);
const esc = (v) => String(v ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function fmtScore(a,b) { return (a === null || b === null || a === undefined || b === undefined) ? '—' : `${a} × ${b}`; }
function matchDone(m) { return m.homeGoals !== null && m.awayGoals !== null && m.homeGoals !== undefined && m.awayGoals !== undefined; }
function out(a,b) { if(a>b) return 'H'; if(a<b) return 'A'; return 'D'; }
function normalizedText() { return byId('search').value.trim().toLowerCase(); }
function containsFilter(...parts) { const q = normalizedText(); return !q || parts.join(' ').toLowerCase().includes(q); }

function scorePoints(m,p) {
  if(!matchDone(m)) return {points:0, exact:0, result:0, none:0};
  if(!p || p.homeGoals === null || p.awayGoals === null || p.homeGoals === undefined || p.awayGoals === undefined) return {points:0, exact:0, result:0, none:1};
  if(p.homeGoals === m.homeGoals && p.awayGoals === m.awayGoals) return {points:9, exact:1, result:0, none:0};
  if(out(p.homeGoals,p.awayGoals) === out(m.homeGoals,m.awayGoals)) return {points:3, exact:0, result:1, none:0};
  return {points:0, exact:0, result:0, none:1};
}

function score(m,p) {
  if(!matchDone(m)) return {cls:'wait', label:'Aguardando jogo'};
  const s = scorePoints(m,p);
  if(s.exact) return {cls:'exact', label:'Placar exato'};
  if(s.result) return {cls:'result', label:'Resultado correto'};
  return {cls:'none', label:'Sem pontuação'};
}

function calculateRanking() {
  const ranking = DATA.participants.map(participant => {
    const totals = { points:0, exact:0, result:0, none:0, played:0 };
    DATA.matches.forEach(match => {
      if(!matchDone(match)) return;
      totals.played += 1;
      const pred = predMap.get(`${participant.id}|${match.id}`);
      const s = scorePoints(match, pred);
      totals.points += s.points;
      totals.exact += s.exact;
      totals.result += s.result;
      totals.none += s.none;
    });
    return { ...participant, ...totals };
  });
  ranking.sort((a,b) => b.points - a.points || b.exact - a.exact || b.result - a.result || a.none - b.none || a.name.localeCompare(b.name, 'pt-BR'));
  ranking.forEach((r, i) => r.position = i + 1);
  DATA.ranking = ranking;
}

function sectionShell(phase, count, inner) {
  return `<article class="card">
    <div class="card-head"><div><h2 class="card-title">${esc(phase.label)}</h2></div><span class="badge">${count} item(ns)</span></div>
    <div class="table-scroll">${inner}</div>
  </article>`;
}

function renderResults() {
  const html = DATA.phaseOrder.map(phase => {
    const rows = DATA.matches.filter(m => m.phase === phase.id && containsFilter(m.id, m.home, m.away, phase.label, m.group));
    const body = rows.length ? rows.map(m => `<tr>
      <td><strong>${esc(m.id)}</strong></td>
      <td>${esc(m.date)} · ${esc(m.time)}</td>
      <td>${esc(m.group || '—')}</td>
      <td class="right"><span>${esc(m.homeFlag || '')}</span> ${esc(m.home)}</td>
      <td class="center"><span class="score ${matchDone(m) ? '' : 'empty'}">${fmtScore(m.homeGoals,m.awayGoals)}</span></td>
      <td><span>${esc(m.awayFlag || '')}</span> ${esc(m.away)}</td>
    </tr>`).join('') : `<tr><td colspan="6" class="center">Nenhum jogo encontrado nesta seção.</td></tr>`;
    return sectionShell(phase, rows.length, `<table><thead><tr><th>Jogo</th><th>Data/Hora</th><th>Grupo</th><th class="right">Mandante</th><th class="center">Placar</th><th>Visitante</th></tr></thead><tbody>${body}</tbody></table>`);
  }).join('');
  byId('results').innerHTML = `<div class="sections">${html}</div>`;
}

function renderPredictions() {
  const html = DATA.phaseOrder.map(phase => {
    const matches = DATA.matches.filter(m => m.phase === phase.id && containsFilter(m.id, m.home, m.away, phase.label, m.group));
    const filteredParticipants = DATA.participants.filter(p => containsFilter(p.name) || matches.some(m => containsFilter(m.id, m.home, m.away, phase.label)));
    const head = `<tr><th class="sticky-left">Participante</th>${matches.map(m => `<th class="center"><div><strong>${esc(m.id)}</strong></div><div style="text-transform:none;font-weight:400">${esc(m.homeFlag || '')} ${esc(m.home)} × ${esc(m.away)} ${esc(m.awayFlag || '')}</div></th>`).join('')}</tr>`;
    const body = matches.length ? filteredParticipants.map(p => `<tr><td class="sticky-left"><strong>${esc(p.name)}</strong></td>${matches.map(m => {
      const pred = predMap.get(`${p.id}|${m.id}`);
      const s = score(m,pred);
      return `<td class="center"><span title="${esc(s.label)}" class="score pred ${s.cls}">${pred ? fmtScore(pred.homeGoals,pred.awayGoals) : '—'}</span></td>`;
    }).join('')}</tr>`).join('') : `<tr><td>Nenhum palpite nesta seção.</td></tr>`;
    const legend = `<div class="legend"><span>Verde: placar exato</span><span>Azul: resultado correto</span><span>Vermelho: sem pontuação</span><span>Cinza: jogo pendente</span></div>`;
    return sectionShell(phase, matches.length, `<table><thead>${head}</thead><tbody>${body}</tbody></table>${legend}`);
  }).join('');
  byId('predictions').innerHTML = `<div class="sections">${html}</div>`;
}

function renderRanking() {
  const q = normalizedText();
  const rows = DATA.ranking.filter(r => !q || r.name.toLowerCase().includes(q));
  const body = rows.map(r => `<tr class="${r.position===1?'top1':r.position===2?'top2':r.position===3?'top3':''}">
    <td>#${r.position}</td><td><strong>${esc(r.name)}</strong></td><td class="center points">${r.points}</td>
    <td class="center">${r.exact}</td><td class="center">${r.result}</td><td class="center">${r.none}</td><td class="center">${r.played}</td>
  </tr>`).join('');
  byId('ranking').innerHTML = `<article class="card"><div class="card-head"><div><h2 class="card-title">Ranking geral</h2></div><span class="badge">${rows.length} participante(s)</span></div><div class="table-scroll"><table class="rank-table"><thead><tr><th>Posição</th><th>Participante</th><th class="center">Pontos</th><th class="center">Acertos de placar</th><th class="center">Acertos de resultado<br><small>(sem placar exato)</small></th><th class="center">Palpites sem pontuação</th><th class="center">Jogos apurados</th></tr></thead><tbody>${body}</tbody></table></div></article>`;
}

function renderAll() {
  if(!DATA) return;
  calculateRanking();
  renderPredictions();
  renderRanking();
  renderResults();
}

function activate(tab) {
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('hidden', p.id !== tab));
}

document.querySelectorAll('.tab').forEach(btn => btn.addEventListener('click', () => activate(btn.dataset.tab)));
byId('search').addEventListener('input', renderAll);

async function loadJson(path) {
  const response = await fetch(path, {
    cache: 'no-store'
  });
  if (!response.ok) {
    throw new Error(`Falha ao carregar ${path}`);
  }
  // usa matches.json como referência
  if (path.includes("matches.json")) {
    const lastModified =
      response.headers.get("last-modified");
    if (lastModified) {
      const date = new Date(lastModified);
      document.getElementById("last-update").innerText =
        "Última atualização: " +
        date.toLocaleString("pt-BR");
    }
  }
  return await response.json();
}

async function init() {
  try {
    const [phaseOrder, matches, participants, predictions] = await Promise.all([
      loadJson('phase_order.json'),
      loadJson('matches.json'),
      loadJson('participants.json'),
      loadJson('predictions.json')
    ]);
    DATA = { phaseOrder, matches, participants, predictions, ranking: [] };
    predMap = new Map(DATA.predictions.map(p => [`${p.participantId}|${p.matchId}`, p]));
    byId('loading').classList.add('hidden');
    byId('predictions').classList.remove('hidden');
    renderAll();
    activate('predictions');
  } catch (error) {
    console.error(error);
    byId('loading').innerHTML = `<strong>Não foi possível carregar os arquivos JSON.</strong><br><br>${esc(error.message)}<br><br>Se você abriu o arquivo por duplo clique, publique no GitHub Pages ou rode um servidor local simples, por exemplo: <code>python -m http.server</code>.`;
  }
}

init();
</script>
</body>
</html>
